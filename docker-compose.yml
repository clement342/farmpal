version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: farmpal-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: farmpal
      MONGO_INITDB_ROOT_PASSWORD: farmpal_secret
      MONGO_INITDB_DATABASE: farmpal
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

volumes:
  mongodb_data:
  mongodb_config:
