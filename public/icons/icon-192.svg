<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>
  <g transform="translate(96,96)">
    <!-- Stem -->
    <line x1="0" y1="10" x2="0" y2="60" stroke="#86efac" stroke-width="6" stroke-linecap="round"/>
    <!-- Left leaf -->
    <path d="M0,20 Q-30,0 -45,25 Q-30,50 0,30Z" fill="url(#leaf)"/>
    <!-- Right leaf -->
    <path d="M0,35 Q30,15 45,40 Q30,65 0,45Z" fill="url(#leaf)"/>
    <!-- Center leaf -->
    <path d="M0,45 Q-15,25 0,5 Q15,25 0,45Z" fill="#4ade80" opacity="0.8"/>
  </g>
</svg>
